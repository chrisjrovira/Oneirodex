# Oneirodex Compose Postgres — client auth (private Docker network).
# Mounted read-only; activated via: postgres -c hba_file=/etc/oneirodex/pg_hba.conf
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
# App container connects over TCP without SSL ("no encryption" in logs).
# Password still required (scram). Do not publish 5432 to the public internet.
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
