<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Oneirodex">
  <title>Oneirodex</title>
  <desc>A closed cabinet holding game cases on a shelf — "theca" is a repository, not a controller.</desc>
  <defs>
    <linearGradient id="odAccent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#12a4a0"/>
      <stop offset="0.45" stop-color="#2fd67b"/>
      <stop offset="1" stop-color="#4ef2a1"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#0b0d10"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25"
        fill="none" stroke="#2fd67b" stroke-opacity="0.26" stroke-width="1.5"/>

  <!-- Closed cabinet: lintel, uprights, shelf. -->
  <rect x="12.4" y="14.5" width="39.2" height="3.2" rx="1.5" fill="url(#odAccent)"/>
  <rect x="12.4" y="14.5" width="3.2" height="33.1" rx="1.5" fill="url(#odAccent)"/>
  <rect x="48.4" y="14.5" width="3.2" height="33.1" rx="1.5" fill="url(#odAccent)"/>
  <rect x="12.4" y="44.4" width="39.2" height="3.2" rx="1.5" fill="url(#odAccent)"/>

  <!-- The collection. Uneven heights and one leaning case read as a shelf
       in use rather than a bar chart. -->
  <rect x="19.5" y="26.5" width="4.6" height="17.7" rx="1.3" fill="#8ff0c4" opacity="0.78"/>
  <rect x="25.0" y="22.0" width="5.4" height="22.2" rx="1.3" fill="url(#odAccent)"/>
  <rect x="31.4" y="24.5" width="4.2" height="19.7" rx="1.3" fill="#8ff0c4" opacity="0.58"/>
  <rect x="36.6" y="20.5" width="5.0" height="23.7" rx="1.3" fill="url(#odAccent)"/>
  <rect x="42.2" y="23.5" width="4.8" height="20.7" rx="1.3" fill="#8ff0c4" opacity="0.72"
        transform="rotate(-13 44.6 44.2)"/>
</svg>
