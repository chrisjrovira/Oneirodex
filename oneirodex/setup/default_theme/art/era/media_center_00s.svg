<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!-- Media centre, 2000s: wall-mounted flat panel, glass AV rack with stacked
       boxes and standby LEDs, floor uplighter. #2fd67b is the accent sentinel. -->
  <defs>
    <linearGradient id="mc-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fd67b" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2fd67b" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="mc-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa4c4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8fa4c4" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="mc-uplight" cx=".5" cy="1" r=".8">
      <stop offset="0" stop-color="#7fb7ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7fb7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- flat panel on a bracket -->
  <g>
    <rect x="470" y="150" width="660" height="392" rx="10" fill="#14181f"/>
    <rect x="484" y="164" width="632" height="352" rx="6" fill="#090b0e"/>
    <rect x="484" y="164" width="632" height="352" rx="6" fill="url(#mc-glow)"/>
    <rect x="470" y="534" width="660" height="12" rx="4" fill="#1e242e"/>
    <circle cx="800" cy="552" r="5" fill="#2fd67b" opacity=".85"/>
    <rect x="770" y="546" width="60" height="42" fill="#14181f"/>
  </g>

  <!-- glass AV rack -->
  <g>
    <rect x="560" y="600" width="480" height="196" rx="6" fill="url(#mc-glass)" stroke="#5c6a80" stroke-width="3"/>
    <line x1="560" y1="666" x2="1040" y2="666" stroke="#5c6a80" stroke-width="3"/>
    <line x1="560" y1="732" x2="1040" y2="732" stroke="#5c6a80" stroke-width="3"/>
    <!-- stacked boxes -->
    <rect x="586" y="618" width="200" height="38" rx="4" fill="#1c222c"/>
    <rect x="600" y="632" width="86" height="8" rx="3" fill="#39465a"/>
    <circle cx="762" cy="637" r="5" fill="#2fd67b" opacity=".9"/>
    <rect x="812" y="618" width="200" height="38" rx="4" fill="#1c222c"/>
    <circle cx="988" cy="637" r="5" fill="#d05a5a" opacity=".8"/>
    <rect x="586" y="684" width="426" height="38" rx="4" fill="#161b23"/>
    <rect x="606" y="698" width="120" height="10" rx="4" fill="#39465a"/>
    <circle cx="984" cy="703" r="5" fill="#2fd67b" opacity=".6"/>
    <!-- slim console standing on end -->
    <rect x="600" y="742" width="36" height="44" rx="5" fill="#222932"/>
    <rect x="608" y="750" width="20" height="4" rx="2" fill="#2fd67b" opacity=".7"/>
  </g>

  <!-- speaker towers -->
  <g fill="#161b23">
    <rect x="320" y="470" width="86" height="330" rx="6"/>
    <rect x="1194" y="470" width="86" height="330" rx="6"/>
  </g>
  <g fill="#0c1016">
    <circle cx="363" cy="530" r="24"/><circle cx="363" cy="600" r="30"/><circle cx="363" cy="684" r="34"/>
    <circle cx="1237" cy="530" r="24"/><circle cx="1237" cy="600" r="30"/><circle cx="1237" cy="684" r="34"/>
  </g>

  <!-- floor uplighter, right -->
  <g>
    <ellipse cx="1420" cy="700" rx="230" ry="260" fill="url(#mc-uplight)"/>
    <rect x="1412" y="560" width="16" height="250" fill="#2a323e"/>
    <path d="M1380 546 h80 l-14 -46 h-52 z" fill="#3a4554"/>
    <rect x="1382" y="806" width="76" height="12" rx="5" fill="#2a323e"/>
  </g>

  <!-- low table with a remote -->
  <g>
    <rect x="120" y="700" width="330" height="14" rx="6" fill="#5c6a80" opacity=".5"/>
    <rect x="140" y="714" width="12" height="96" fill="#2a323e"/>
    <rect x="418" y="714" width="12" height="96" fill="#2a323e"/>
    <rect x="214" y="676" width="120" height="22" rx="10" fill="#1c222c"/>
    <circle cx="236" cy="687" r="5" fill="#2fd67b" opacity=".7"/>
  </g>
</svg>
