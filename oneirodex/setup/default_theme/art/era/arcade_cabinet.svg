<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!-- Arcade row. Original cabinet geometry, invented marquee shapes — no
       operator names, no licensed art. #2fd67b is the accent sentinel. -->
  <defs>
    <linearGradient id="ac-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fd67b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2fd67b" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="ac-marquee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d9d"/><stop offset=".5" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#4dd2ff"/>
    </linearGradient>
    <radialGradient id="ac-spill" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- a cabinet, drawn once and placed three times -->
  <defs>
    <g id="ac-cab">
      <path d="M0 0 h300 v150 l-16 44 h-268 l-16 -44 z" fill="#171a22"/>
      <rect x="18" y="14" width="264" height="104" rx="4" fill="url(#ac-marquee)" opacity=".92"/>
      <rect x="40" y="46" width="90" height="40" rx="4" fill="#12141a" opacity=".55"/>
      <rect x="150" y="46" width="112" height="40" rx="4" fill="#12141a" opacity=".35"/>
      <path d="M-8 194 h316 v330 h-316 z" fill="#1d2230"/>
      <rect x="26" y="222" width="248" height="200" rx="10" fill="#07090c"/>
      <rect x="34" y="230" width="232" height="184" rx="7" fill="url(#ac-screen)"/>
      <g fill="#07090c" opacity=".35">
        <rect x="34" y="238" width="232" height="3"/><rect x="34" y="250" width="232" height="3"/>
        <rect x="34" y="262" width="232" height="3"/><rect x="34" y="274" width="232" height="3"/>
        <rect x="34" y="286" width="232" height="3"/><rect x="34" y="298" width="232" height="3"/>
        <rect x="34" y="310" width="232" height="3"/><rect x="34" y="322" width="232" height="3"/>
        <rect x="34" y="334" width="232" height="3"/><rect x="34" y="346" width="232" height="3"/>
        <rect x="34" y="358" width="232" height="3"/><rect x="34" y="370" width="232" height="3"/>
        <rect x="34" y="382" width="232" height="3"/><rect x="34" y="394" width="232" height="3"/>
      </g>
      <!-- control deck -->
      <path d="M-14 524 h328 l-18 86 h-292 z" fill="#242b3a"/>
      <circle cx="78" cy="566" r="15" fill="#0d1017"/>
      <rect x="72" y="524" width="12" height="46" rx="6" fill="#8a93a8"/>
      <circle cx="78" cy="520" r="13" fill="#ff4d6d"/>
      <circle cx="152" cy="560" r="11" fill="#ffd34d"/>
      <circle cx="188" cy="574" r="11" fill="#4dd2ff"/>
      <circle cx="224" cy="560" r="11" fill="#b04dff"/>
      <!-- coin door -->
      <rect x="86" y="646" width="128" height="86" rx="4" fill="#12151d"/>
      <rect x="112" y="668" width="76" height="10" rx="5" fill="#8a93a8" opacity=".6"/>
      <path d="M-14 610 h328 v240 h-328 z" fill="#161a24"/>
    </g>
  </defs>

  <!-- back wall + light spill from the marquees -->
  <rect x="0" y="0" width="1600" height="900" fill="#0a0c12"/>
  <rect x="0" y="0" width="1600" height="420" fill="url(#ac-spill)"/>

  <use href="#ac-cab" x="96" y="120"/>
  <use href="#ac-cab" x="642" y="104"/>
  <use href="#ac-cab" x="1188" y="130"/>

  <!-- floor: dark tile grid catching the glow -->
  <g opacity=".5">
    <rect x="0" y="820" width="1600" height="80" fill="#111520"/>
    <g stroke="#2a3348" stroke-width="2">
      <line x1="0" y1="840" x2="1600" y2="840"/>
      <line x1="0" y1="866" x2="1600" y2="866"/>
      <line x1="200" y1="820" x2="160" y2="900"/>
      <line x1="560" y1="820" x2="530" y2="900"/>
      <line x1="920" y1="820" x2="900" y2="900"/>
      <line x1="1280" y1="820" x2="1270" y2="900"/>
    </g>
  </g>
</svg>
