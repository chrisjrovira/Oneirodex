<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!-- Teen bedroom, 90s. Striped paper, band posters as shapes, portable TV on a
       milk crate, shelf of cartridges. #2fd67b is the accent sentinel. -->
  <defs>
    <linearGradient id="tb-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fd67b" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2fd67b" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="tb-lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- posters, taped up crooked -->
  <g>
    <g transform="rotate(-4 270 250)">
      <rect x="150" y="120" width="240" height="320" fill="#c45c6a"/>
      <circle cx="270" cy="250" r="72" fill="#3a1c28" opacity=".7"/>
      <rect x="182" y="366" width="176" height="14" fill="#3a1c28" opacity=".7"/>
      <rect x="182" y="392" width="118" height="10" fill="#3a1c28" opacity=".5"/>
    </g>
    <g transform="rotate(3 520 210)">
      <rect x="430" y="96" width="186" height="240" fill="#3a6a9a"/>
      <path d="M460 300 L510 180 L560 300 Z" fill="#dce8f4" opacity=".75"/>
      <rect x="460" y="120" width="120" height="10" fill="#dce8f4" opacity=".6"/>
    </g>
    <g transform="rotate(-2 720 176)">
      <rect x="648" y="96" width="150" height="170" fill="#d4b04a"/>
      <g fill="#2a2010" opacity=".72">
        <rect x="672" y="128" width="102" height="12"/>
        <rect x="672" y="152" width="78" height="12"/>
        <rect x="672" y="176" width="90" height="12"/>
        <rect x="672" y="200" width="60" height="12"/>
      </g>
    </g>
  </g>

  <!-- shelf of cartridges and a boombox, right wall -->
  <g>
    <rect x="1120" y="250" width="420" height="18" rx="4" fill="#4a3a5a"/>
    <g>
      <rect x="1140" y="160" width="24" height="90" fill="#7a5aa0"/>
      <rect x="1168" y="160" width="20" height="90" fill="#5a3a88"/>
      <rect x="1192" y="168" width="26" height="82" fill="#8a6ab0"/>
      <rect x="1222" y="160" width="18" height="90" fill="#4a2a70"/>
      <rect x="1244" y="164" width="24" height="86" fill="#7a5aa0"/>
    </g>
    <g>
      <rect x="1300" y="150" width="220" height="100" rx="10" fill="#2a2038"/>
      <circle cx="1350" cy="200" r="30" fill="#151020"/><circle cx="1350" cy="200" r="14" fill="#3a2c50"/>
      <circle cx="1470" cy="200" r="30" fill="#151020"/><circle cx="1470" cy="200" r="14" fill="#3a2c50"/>
      <rect x="1388" y="176" width="44" height="30" rx="3" fill="#151020"/>
      <rect x="1388" y="216" width="44" height="8" rx="3" fill="#2fd67b" opacity=".7"/>
    </g>
  </g>

  <!-- bed, lower left -->
  <g>
    <rect x="40" y="620" width="420" height="120" rx="10" fill="#5a3a58"/>
    <rect x="40" y="620" width="420" height="34" rx="10" fill="#7a4a72"/>
    <rect x="60" y="576" width="140" height="58" rx="12" fill="#c8a8d8" opacity=".85"/>
    <rect x="40" y="736" width="420" height="30" rx="6" fill="#2a1828"/>
  </g>

  <!-- portable TV on a crate, centre right -->
  <g>
    <rect x="700" y="600" width="260" height="170" rx="6" fill="#3a2c50"/>
    <g stroke="#221838" stroke-width="8" fill="none">
      <rect x="716" y="616" width="228" height="138"/>
      <line x1="830" y1="616" x2="830" y2="754"/>
      <line x1="716" y1="686" x2="944" y2="686"/>
    </g>
    <g>
      <rect x="712" y="404" width="270" height="200" rx="16" fill="#4a3a5a"/>
      <rect x="734" y="426" width="190" height="156" rx="12" fill="#0b0d10"/>
      <rect x="740" y="432" width="178" height="144" rx="9" fill="url(#tb-glow)"/>
      <g fill="#0b0d10" opacity=".3">
        <rect x="740" y="440" width="178" height="3"/><rect x="740" y="454" width="178" height="3"/>
        <rect x="740" y="468" width="178" height="3"/><rect x="740" y="482" width="178" height="3"/>
        <rect x="740" y="496" width="178" height="3"/><rect x="740" y="510" width="178" height="3"/>
        <rect x="740" y="524" width="178" height="3"/><rect x="740" y="538" width="178" height="3"/>
        <rect x="740" y="552" width="178" height="3"/><rect x="740" y="566" width="178" height="3"/>
      </g>
      <circle cx="952" cy="452" r="12" fill="#2a2038"/>
      <circle cx="952" cy="486" r="12" fill="#2a2038"/>
      <rect x="936" y="516" width="32" height="56" rx="4" fill="#2a2038"/>
      <path d="M800 404 L742 300" stroke="#8a7aa8" stroke-width="7" fill="none"/>
      <path d="M880 404 L948 296" stroke="#8a7aa8" stroke-width="7" fill="none"/>
    </g>
  </g>

  <!-- lamp glow and a beanbag -->
  <ellipse cx="1250" cy="700" rx="220" ry="150" fill="url(#tb-lamp)"/>
  <path d="M1140 790 q120 -110 250 -20 q40 60 -30 92 h-190 q-60 -22 -30 -72 z" fill="#6a4a80" opacity=".9"/>

  <!-- controller and its cable on the floor -->
  <path d="M640 812 q90 -60 180 -10 q90 50 170 -14" fill="none" stroke="#2a1828" stroke-width="8" opacity=".8"/>
  <rect x="592" y="792" width="120" height="42" rx="12" fill="#3a2c50"/>
  <rect x="612" y="806" width="9" height="20" fill="#7a5aa0"/>
  <rect x="604" y="812" width="25" height="8" fill="#7a5aa0"/>
  <circle cx="676" cy="812" r="8" fill="#c45c6a"/>
</svg>
