{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ 'css/setup/setup.css'|theme_asset }}">

<div class="container-login">
    <div class="content-login od-setup" role="main" aria-labelledby="od-confirm-invalid-title">
        <div class="od-setup__brand">
            <img
                src="{{ url_for('static', filename='newstyle/oneirodex_mark.svg') }}"
                alt=""
                class="od-setup__mark"
                width="56"
                height="56"
                decoding="async"
            >
            <h1 id="od-confirm-invalid-title" class="od-setup__title">Invalid link</h1>
            <p class="od-setup__lede">This confirmation link is not valid. Check your email for the correct link, or sign in if your account is already active.</p>
        </div>
        <div class="od-setup__actions">
            <a href="{{ url_for('login.login') }}" class="btn btn-primary">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
