{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ 'css/setup/setup.css'|theme_asset }}">

<div class="container-login">
    <div class="content-login od-setup" role="main" aria-labelledby="od-reset-title">
        <div class="od-setup__brand">
            <img
                src="{{ url_for('static', filename='newstyle/oneirodex_mark.svg') }}"
                alt=""
                class="od-setup__mark"
                width="56"
                height="56"
                decoding="async"
            >
            <h1 id="od-reset-title" class="od-setup__title">Choose a new password</h1>
            <p class="od-setup__lede">Enter and confirm your new password to finish the reset.</p>
        </div>

        <form action="{{ url_for('login.reset_password', token=token) }}" method="post" novalidate>
            {{ form.csrf_token }}
            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" class="od-setup__field" id="password" name="password" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input type="password" class="od-setup__field" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
            </div>
            <div class="od-setup__actions">
                <input type="submit" value="Reset password" class="btn btn-primary">
                <a href="{{ url_for('login.login') }}" class="btn btn-secondary">Back to sign in</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
