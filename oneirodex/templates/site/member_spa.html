{% extends "base_empty.html" %}

{% block content %}
{% set prefs = current_user.preferences %}
<div
  id="member-app-root"
  data-tile-size="{{ (prefs.tile_size if prefs and prefs.tile_size else '50') }}"
  data-is-admin="{{ 'true' if current_user.role == 'admin' else 'false' }}"
  data-is-librarian="{{ 'true' if current_user.role in ('admin', 'librarian') else 'false' }}"
  data-role="{{ current_user.role or 'user' }}"
  data-user-id="{{ current_user.id or '' }}"
  data-show-trailers="{{ 'true' if show_trailers else 'false' }}"
  data-show-help="{{ 'true' if show_help_button else 'false' }}"
  data-enable-vr="{{ 'true' if enable_vr_browse else 'false' }}"
  data-enable-activity="{{ 'true' if enable_activity_feed else 'false' }}"
  {# UIR-1 two-bar chrome — opt-in until pages adopt it. #}
  data-enable-new-chrome="{{ 'true' if enable_new_chrome else 'false' }}"
  data-show-play-status="{{ 'true' if show_play_status else 'false' }}"
  {# AGPL §13 source offer. Configurable via GT_SOURCE_URL — a modified
     deployment owes its users *its* source, not upstream's. #}
  data-source-url="{{ source_url or '' }}"
  data-app-version="{{ app_version or '' }}"
  data-username="{{ current_user.name or '' }}"
  {# The account button shows who you are signed in as, and a generic person
     glyph does not — every member had the same one. Shipped with the shell
     rather than fetched, because the button renders before any API call. #}
  data-avatar="{{ current_user.avatarpath|avatar_url }}"
  data-locale="{{ (prefs.locale if prefs and prefs.locale else 'en') }}"
  data-per-page="{{ user_per_page if user_per_page is defined else (prefs.items_per_page if prefs and prefs.items_per_page else 20) }}"
  data-default-sort="{{ user_default_sort if user_default_sort is defined else (prefs.default_sort if prefs and prefs.default_sort else 'name') }}"
  data-default-sort-order="{{ user_default_sort_order if user_default_sort_order is defined else (prefs.default_sort_order if prefs and prefs.default_sort_order else 'asc') }}"
  data-library-count="{{ library_count if library_count is defined else 0 }}"
  data-games-count="{{ games_count if games_count is defined else 0 }}"
  data-enable-delete-on-disk="{{ 'true' if enable_delete_game_on_disk else 'false' }}"
  data-current-filters="{{ (filters if filters is defined else {})|tojson|e }}"
></div>
<link rel="stylesheet" href="{{ 'member-app/member-app.css'|dist_asset }}">
<link rel="stylesheet" href="{{ 'css/od-era.css'|theme_asset }}">
<script type="module" src="{{ 'member-app/member-app.js'|dist_asset }}"></script>
{% endblock %}
