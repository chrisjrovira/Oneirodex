<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing — GameTheca</title>
    <link rel="stylesheet" href="./play-skins.css">
    <script src="./play-skins.js"></script>
</head>
<body class="gt-play-shell">
    <div id="gt-emu-bar">
        <strong class="gt-play-brand">GameTheca</strong>
        <span class="gt-play-system" id="gt-play-system" hidden></span>
        <button type="button" id="gt-sync-save" title="Uploads/downloads the cloud1 slot. Browser WASM state sync is not fully wired yet.">Sync cloud slot</button>
        <label>Cheats <select id="gt-cheat-select"><option value="">None</option></select></label>
        <button type="button" id="gt-load-cheat">Load .cht</button>
        <span id="gt-emu-status"></span>
    </div>
    <div id="gt-play-stage">
        <div id="gt-play-bezel">
            <div id="webretro"></div>
        </div>
    </div>
    <script src="./constants.js"></script>
    <script>
        (function () {
            function getQueryStringArgs() {
                var args = {};
                var query = window.location.search.substring(1);
                var pairs = query.replace(/\+/g, ' ').split('&');
                for (var i = 0; i < pairs.length; i++) {
                    var pair = pairs[i].split('=');
                    args[decodeURIComponent(pair[0] || '')] = decodeURIComponent(pair[1] || '');
                }
                return args;
            }

            function csrfToken() {
                var meta = document.querySelector('meta[name="csrf-token"]');
                if (meta && meta.content) return meta.content;
                var match = document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);
                return match ? decodeURIComponent(match[1]) : '';
            }

            var args = getQueryStringArgs();
            var guid = args.guid || '';
            var core = args.core || '';
            var platform = args.platform || '';
            var statusEl = document.getElementById('gt-emu-status');
            var cheatSelect = document.getElementById('gt-cheat-select');
            var systemEl = document.getElementById('gt-play-system');

            var skin = (window.GameThecaPlaySkins && window.GameThecaPlaySkins.applyPlaySkin)
                ? window.GameThecaPlaySkins.applyPlaySkin(platform, core)
                : { systemLabel: platform || core || 'Emulator' };

            if (systemEl && skin.systemLabel) {
                systemEl.hidden = false;
                systemEl.textContent = skin.systemLabel;
            }
            document.title = (skin.systemLabel ? skin.systemLabel + ' — ' : '') + 'GameTheca Play';

            function setStatus(msg) {
                statusEl.textContent = msg || '';
            }

            function webretroEmbed(node, path, queries) {
                var frame = document.createElement('iframe');
                frame.id = 'gt-webretro-frame';
                var apiUrl = '/api/downloadrom/';
                var link = document.createElement('a');
                link.href = apiUrl;
                apiUrl = link.href;
                frame.src = path + '?core=' + encodeURIComponent(queries.core || '') +
                    '&rom=' + encodeURIComponent(apiUrl + queries.guid);
                node.appendChild(frame);
                return frame;
            }

            var path = location.protocol + '//' + location.host + '/static/vendor/webretro/standalone.html';
            webretroEmbed(document.getElementById('webretro'), path, { core: core, guid: guid });

            if (guid) {
                fetch('/api/games/' + encodeURIComponent(guid) + '/cheats', { credentials: 'same-origin' })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        (data.cheats || []).forEach(function (row) {
                            var opt = document.createElement('option');
                            opt.value = row.url;
                            opt.textContent = row.name;
                            cheatSelect.appendChild(opt);
                        });
                    })
                    .catch(function () {});

                // Prefer server platform when query omitted or stale.
                if (!platform) {
                    fetch('/api/games/' + encodeURIComponent(guid) + '/details', { credentials: 'same-origin' })
                        .then(function (r) { return r.ok ? r.json() : null; })
                        .then(function (data) {
                            var key = data && (data.library_platform || data.platform);
                            if (!key || !window.GameThecaPlaySkins) return;
                            skin = window.GameThecaPlaySkins.applyPlaySkin(key, core);
                            if (systemEl && skin.systemLabel) {
                                systemEl.hidden = false;
                                systemEl.textContent = skin.systemLabel;
                            }
                            document.title = skin.systemLabel + ' — GameTheca Play';
                        })
                        .catch(function () {});
                }
            }

            document.getElementById('gt-sync-save').addEventListener('click', function () {
                if (!guid) return;
                setStatus('Syncing cloud save…');
                // Round-trip: download existing cloud1 if present, then re-upload browser slot bytes.
                fetch('/api/games/' + encodeURIComponent(guid) + '/saves', { credentials: 'same-origin' })
                    .then(function (r) { return r.json(); })
                    .then(function (listData) {
                        var slots = (listData && listData.saves) || [];
                        var hasCloud = slots.some(function (s) { return s.slot_name === 'cloud1'; });
                        if (hasCloud) {
                            return fetch('/api/games/' + encodeURIComponent(guid) + '/saves/cloud1', {
                                credentials: 'same-origin',
                            }).then(function (r) {
                                return r.ok ? r.blob() : null;
                            });
                        }
                        return null;
                    })
                    .then(function (existingBlob) {
                        var hadExisting = Boolean(existingBlob);
                        var payloadBlob = existingBlob || new Blob(
                            [
                                'GameTheca cloud1 slot placeholder — real libretro .state/.srm sync is not wired from WebRetro IndexedDB yet. ',
                                'guid=' + guid + ' @ ' + new Date().toISOString(),
                            ].join(''),
                            { type: 'application/octet-stream' },
                        );
                        var body = new FormData();
                        body.append('file', payloadBlob, 'cloud.state');
                        body.append('slot', 'cloud1');
                        return fetch('/api/games/' + encodeURIComponent(guid) + '/saves', {
                            method: 'POST',
                            credentials: 'same-origin',
                            headers: { 'X-CSRFToken': csrfToken() },
                            body: body,
                        }).then(function (r) {
                            return r.json().then(function (j) {
                                return { ok: r.ok, j: j, hadExisting: hadExisting };
                            });
                        });
                    })
                    .then(function (res) {
                        setStatus(res.ok
                            ? (res.hadExisting ? 'Cloud slot cloud1 refreshed' : 'Cloud slot cloud1 updated (placeholder until WASM state export)')
                            : (res.j.error || 'Sync failed'));
                    })
                    .catch(function () { setStatus('Sync failed'); });
            });

            document.getElementById('gt-load-cheat').addEventListener('click', function () {
                var url = cheatSelect.value;
                if (!url) {
                    setStatus('Select a .cht file');
                    return;
                }
                fetch(url, { credentials: 'same-origin' })
                    .then(function (r) { return r.text(); })
                    .then(function (text) {
                        try {
                            sessionStorage.setItem('gt_pending_cht', text);
                            sessionStorage.setItem('gt_pending_cht_name', cheatSelect.options[cheatSelect.selectedIndex].text);
                        } catch (e) {}
                        setStatus('Cheat loaded into session — open RetroArch Quick Menu → Cheats to apply');
                    })
                    .catch(function () { setStatus('Failed to load cheat'); });
            });
        })();
    </script>
</body>
</html>
