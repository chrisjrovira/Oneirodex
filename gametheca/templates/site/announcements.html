{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ 'css/site/member_hub.css'|theme_asset }}">
<script src="{{ 'js/member_hub.js'|theme_asset }}"></script>

<div class="gt-hub" data-is-admin="{{ is_admin|lower }}">
    <header class="gt-hub__header">
        <h1>News</h1>
        <p class="gt-hub__lede">Announcements from your GameTheca admins.</p>
    </header>

    {% if is_admin %}
    <form id="gt-announcement-create" class="gt-hub__form">
        <label>
            Title
            <input type="text" name="title" maxlength="200" required>
        </label>
        <label>
            Body
            <textarea name="body" rows="4" maxlength="20000" required></textarea>
        </label>
        <button type="submit" class="gt-action-bar__btn gt-action-bar__btn--primary">Publish</button>
    </form>
    {% endif %}

    <div id="gt-announcements-list" class="gt-hub__list" aria-live="polite">
        <p class="gt-hub__empty">Loading news…</p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  if (window.GameThecaMemberHub) {
    GameThecaMemberHub.initAnnouncements({{ is_admin|lower }})
  }
})
</script>
{% endblock %}
