{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ 'css/site/member_hub.css'|theme_asset }}">
<script src="{{ 'js/member_hub.js'|theme_asset }}"></script>

<div class="gt-hub" data-collection-uuid="{{ collection_uuid }}">
    <header class="gt-hub__header">
        <p class="gt-hub__crumb"><a href="{{ url_for('member.collections_page') }}">← Collections</a></p>
        <h1 id="gt-collection-title">Collection</h1>
        <p id="gt-collection-desc" class="gt-hub__lede"></p>
    </header>

    <div id="gt-collection-items" class="gt-hub__list" aria-live="polite">
        <p class="gt-hub__empty">Loading…</p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  if (window.GameThecaMemberHub) {
    GameThecaMemberHub.initCollectionDetail('{{ collection_uuid }}')
  }
})
</script>
{% endblock %}
