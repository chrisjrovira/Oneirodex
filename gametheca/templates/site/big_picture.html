{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ 'css/site/big_picture.css'|theme_asset }}">
<script src="{{ 'js/big_picture.js'|theme_asset }}"></script>

<div class="gt-bp" id="gt-big-picture" tabindex="-1">
    <header class="gt-bp__header">
        <div>
            <h1 class="gt-bp__title">Big Picture</h1>
            <p class="gt-bp__hint">← → browse · Enter / A open · D download · B attract · Esc blur · Home first</p>
        </div>
        <div class="gt-bp__header-actions">
            <a href="/trailers?attract_mode=true" class="gt-bp__link" id="gt-bp-attract" title="Open Attract Mode (B)">Attract</a>
            <a href="{{ url_for('library.library') }}" class="gt-bp__exit">Exit</a>
        </div>
    </header>

    <section class="gt-bp__hero" aria-live="polite">
        <div class="gt-bp__hero-art" id="gt-bp-hero-art" hidden></div>
        <div class="gt-bp__hero-body">
            <h2 id="gt-bp-hero-title" class="gt-bp__hero-title">Loading…</h2>
            <p id="gt-bp-hero-meta" class="gt-bp__hero-meta"></p>
            <p id="gt-bp-hero-summary" class="gt-bp__hero-summary"></p>
            <div class="gt-bp__hero-actions" id="gt-bp-hero-actions" hidden>
                <button type="button" class="gt-bp__btn gt-bp__btn--primary" id="gt-bp-open">Open</button>
                <a class="gt-bp__btn" id="gt-bp-download" href="#">Download</a>
            </div>
        </div>
    </section>

    <div class="gt-bp__rail-wrap">
        <div id="gt-bp-rail" class="gt-bp__rail" role="listbox" aria-label="Game rail">
            <p class="gt-bp__empty">Loading games…</p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  if (window.GameThecaBigPicture) {
    GameThecaBigPicture.init()
  }
})
</script>
{% endblock %}
