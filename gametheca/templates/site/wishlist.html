{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ 'css/site/member_hub.css'|theme_asset }}">
<script src="{{ 'js/member_hub.js'|theme_asset }}"></script>

<div class="gt-hub" data-is-admin="{{ is_admin|lower }}" data-is-librarian="{{ is_librarian|lower }}">
    <header class="gt-hub__header">
        <h1>Wishlist</h1>
        <p class="gt-hub__lede">Request titles you’d like added to the library.</p>
    </header>

    <form id="gt-wishlist-create" class="gt-hub__form">
        <label>
            Title
            <input type="text" name="title" maxlength="255" required placeholder="Game title">
        </label>
        <label>
            Notes
            <input type="text" name="notes" maxlength="400" placeholder="Optional details">
        </label>
        <button type="submit" class="gt-action-bar__btn gt-action-bar__btn--primary">Request</button>
    </form>

    {% if is_librarian %}
    <label class="gt-hub__check gt-hub__check--solo">
        <input type="checkbox" id="gt-wishlist-all">
        Show everyone’s requests
    </label>
    {% endif %}

    <div id="gt-wishlist-list" class="gt-hub__list" aria-live="polite">
        <p class="gt-hub__empty">Loading wishlist…</p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  if (window.GameThecaMemberHub) {
    GameThecaMemberHub.initWishlist({{ is_librarian|lower }})
  }
})
</script>
{% endblock %}
