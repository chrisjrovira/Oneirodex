{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ 'css/site/member_hub.css'|theme_asset }}">
<script src="{{ 'js/member_hub.js'|theme_asset }}"></script>

<div class="gt-hub">
    <header class="gt-hub__header">
        <h1>Collections</h1>
        <p class="gt-hub__lede">Curated shelves you and others share across the library.</p>
    </header>

    <form id="gt-collection-create" class="gt-hub__form" autocomplete="off">
        <label>
            Name
            <input type="text" name="name" maxlength="120" required placeholder="Cozy co-op nights">
        </label>
        <label>
            Description
            <input type="text" name="description" maxlength="400" placeholder="Optional">
        </label>
        <label class="gt-hub__check">
            <input type="checkbox" name="is_public" checked>
            Public
        </label>
        <button type="submit" class="gt-action-bar__btn gt-action-bar__btn--primary">Create</button>
    </form>

    <div id="gt-collections-list" class="gt-hub__list" aria-live="polite">
        <p class="gt-hub__empty">Loading collections…</p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  if (window.GameThecaMemberHub) {
    GameThecaMemberHub.initCollections()
  }
})
</script>
{% endblock %}
