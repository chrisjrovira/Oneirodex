{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ 'css/games/library_browser.css'|theme_asset }}">
<link rel="stylesheet" href="{{ 'css/games/game_status.css'|theme_asset }}">

<script src="{{ 'js/library_search.js'|theme_asset }}"></script>

<div class="glass-panel">
    <div
        id="library-grid-root"
        data-per-page="{{ user_per_page }}"
        data-default-sort="{{ user_default_sort }}"
        data-default-sort-order="{{ user_default_sort_order }}"
        data-is-admin="{{ is_admin|lower }}"
        data-show-play-status="{{ show_play_status|lower }}"
        data-library-count="{{ library_count }}"
        data-games-count="{{ games_count }}"
        data-enable-delete-on-disk="{{ enable_delete_game_on_disk|lower }}"
        data-discord-configured="{{ discord_configured|lower }}"
        data-discord-manual-trigger="{{ discord_manual_trigger_enabled|lower }}"
        data-current-filters="{{ filters|tojson|e }}"
        data-locale="{{ user_locale|default('en') }}"
    ></div>
</div>

<!-- Search Modal (required by library_search.js) -->
<div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content modal-content-search">
            <div class="modal-header">
                <h5 class="modal-title" id="searchModalLabel">Search</h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <input type="text" class="form-control" id="searchInput" placeholder="Start typing...">
                <div id="searchResults"></div>
            </div>
        </div>
    </div>
</div>

<script>
    var libraryManagerUrl = "{{ url_for('library.libraries') }}";
    var libraryScanUrl = "{{ url_for('main.scan_management', library_uuid=library_uuid) }}";
</script>
<script type="module" src="{{ url_for('static', filename='dist/member-app/member-app.js') }}"></script>
{% endblock %}
