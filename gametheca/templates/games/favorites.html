{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ 'css/games/discover.css'|theme_asset }}">
<link rel="stylesheet" href="{{ 'css/games/library_browser.css'|theme_asset }}">
<link rel="stylesheet" href="{{ 'css/games/game_status.css'|theme_asset }}">
<script src="{{ url_for('static', filename='library/themes/default/js/csrf_utils.js') }}"></script>

<div class="discovery-panel">
    <h1 class="discovery-header"><p>My Favorites</p></h1>
    <div
        id="favorites-grid-root"
        data-is-admin="{{ (current_user.role == 'admin')|lower }}"
        data-show-play-status="{{ show_play_status|lower }}"
    ></div>
</div>

<script type="module" src="{{ url_for('static', filename='dist/member-app/member-app.js') }}"></script>
{% endblock %}
