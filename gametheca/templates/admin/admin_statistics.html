{% extends "base_admin.html" %}
{% block content %}
<link rel="stylesheet" href="{{ 'css/admin/admin-pages.css'|theme_asset }}">

<div class="container-settings gt-adminpage gt-adminpage--xl">
    <div class="gt-adminpage-header">
        <div>
            <h1 class="gt-adminpage-title">GameTheca Statistics</h1>
            <p class="gt-adminpage-lede">Downloads, top titles, and library activity.</p>
        </div>
    </div>

    <div class="gt-adminpage-panel">
        <div class="row">
            <div class="col-md-6">
                <div class="gt-adminpage-chart">
                    <canvas id="downloadsPerUserChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="gt-adminpage-chart">
                    <canvas id="topGamesChart"></canvas>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="gt-adminpage-chart">
                    <canvas id="downloadTrendsChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="gt-adminpage-chart">
                    <canvas id="inviteTokensChart"></canvas>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="gt-adminpage-chart">
                    <canvas id="topDownloadersChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="gt-adminpage-chart">
                    <canvas id="topCollectorsChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='vendor/chart.js/4.4.1/chart.umd.min.js') }}"></script>
<script src="{{ 'js/chart-utils.js'|theme_asset }}"></script>
<script src="{{ 'js/admin-statistics.js'|theme_asset }}"></script>

{% endblock %}
