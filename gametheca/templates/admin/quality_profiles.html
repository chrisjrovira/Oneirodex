{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ 'css/admin/admin-pages.css'|theme_asset }}">
<div class="container gt-adminpage gt-adminpage--md gt-adminpage--spaced">
    <div class="gt-adminpage-header">
        <div>
            <h1 class="gt-adminpage-title"><i class="fas fa-sliders-h"></i> Quality profiles</h1>
            <p class="gt-adminpage-lede">
                Preferred and blocked release groups plus size bands. Used to score Arr search hits.
            </p>
        </div>
    </div>
    <div class="gt-adminpage-panel">
    <div id="qp-status" class="gt-adminpage-status text-muted mb-3">Loading…</div>
    <div class="mb-3">
        <label class="form-label">Preferred groups (comma-separated)</label>
        <input id="qp-preferred" class="form-control" placeholder="FITGIRL, GOG">
    </div>
    <div class="mb-3">
        <label class="form-label">Blocked groups (comma-separated)</label>
        <input id="qp-blocked" class="form-control" placeholder="DODI">
    </div>
    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label">Min size (MB)</label>
            <input id="qp-min" type="number" class="form-control" min="0" step="1" placeholder="optional">
        </div>
        <div class="col-md-6">
            <label class="form-label">Max size (MB)</label>
            <input id="qp-max" type="number" class="form-control" min="0" step="1" placeholder="optional">
        </div>
    </div>
    <div class="form-check mb-3">
        <input id="qp-repack" class="form-check-input" type="checkbox" checked>
        <label class="form-check-label" for="qp-repack">Prefer repack / proper in titles</label>
    </div>
    <div class="gt-adminpage-actions">
        <button id="qp-save" class="btn btn-primary">Save</button>
    </div>
    </div>
    <p><a class="gt-adminpage-backlink" href="{{ url_for('site.admin_dashboard') }}"><i class="fas fa-arrow-left"></i> Back to admin</a></p>
</div>
<script>
(async function () {
  const csrf = document.querySelector('meta[name="csrf-token"]')?.content;
  const headers = { 'Content-Type': 'application/json', 'X-CSRFToken': csrf };
  const status = document.getElementById('qp-status');

  function splitList(value) {
    return String(value || '').split(',').map((s) => s.trim()).filter(Boolean);
  }

  try {
    const res = await fetch('/api/quality-profiles', { credentials: 'same-origin' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load');
    document.getElementById('qp-preferred').value = (data.preferred_groups || []).join(', ');
    document.getElementById('qp-blocked').value = (data.blocked_groups || []).join(', ');
    document.getElementById('qp-min').value = data.min_size_mb ?? '';
    document.getElementById('qp-max').value = data.max_size_mb ?? '';
    document.getElementById('qp-repack').checked = data.prefer_repack !== false;
    status.textContent = 'Loaded';
  } catch (err) {
    status.textContent = err.message;
  }

  document.getElementById('qp-save').addEventListener('click', async () => {
    const body = {
      preferred_groups: splitList(document.getElementById('qp-preferred').value),
      blocked_groups: splitList(document.getElementById('qp-blocked').value),
      min_size_mb: document.getElementById('qp-min').value || null,
      max_size_mb: document.getElementById('qp-max').value || null,
      prefer_repack: document.getElementById('qp-repack').checked,
    };
    const res = await fetch('/api/quality-profiles', {
      method: 'PUT', credentials: 'same-origin', headers, body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    status.textContent = res.ok ? 'Saved' : (data.error || 'Save failed');
  });
})();
</script>
{% endblock %}
