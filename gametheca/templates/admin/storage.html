{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ 'css/admin/admin-pages.css'|theme_asset }}">
<div class="container gt-adminpage gt-adminpage--md gt-adminpage--spaced">
    <div class="gt-adminpage-header">
        <div>
            <h1 class="gt-adminpage-title"><i class="fas fa-hard-drive"></i> Storage / hardlinks</h1>
            <p class="gt-adminpage-lede">
                Preview same-volume hardlinks. Apply requires <code>ALLOW_HARDLINK_APPLY=true</code>.
                Docker read-only mounts will fail writability checks.
            </p>
        </div>
    </div>
    <div class="gt-adminpage-panel">
    <div class="mb-3">
        <label class="form-label">Source file</label>
        <input id="hl-source" class="form-control" placeholder="C:\\games\\Title\\setup.exe">
    </div>
    <div class="mb-3">
        <label class="form-label">Destination path</label>
        <input id="hl-dest" class="form-control" placeholder="C:\\library\\Title\\setup.exe">
    </div>
    <div class="gt-adminpage-actions mb-3">
        <button id="hl-preview" class="btn btn-secondary">Preview</button>
        <button id="hl-apply" class="btn btn-primary" {% if not allow_apply %}disabled title="ALLOW_HARDLINK_APPLY is off"{% endif %}>Apply</button>
    </div>
    <pre id="hl-out" class="gt-adminpage-output"></pre>
    </div>
    <p><a class="gt-adminpage-backlink" href="{{ url_for('site.admin_dashboard') }}"><i class="fas fa-arrow-left"></i> Back to admin</a></p>
</div>
<script>
(async function () {
  const csrf = document.querySelector('meta[name="csrf-token"]')?.content;
  const headers = { 'Content-Type': 'application/json', 'X-CSRFToken': csrf };
  const out = document.getElementById('hl-out');
  async function call(path) {
    const body = {
      source: document.getElementById('hl-source').value.trim(),
      dest: document.getElementById('hl-dest').value.trim(),
    };
    const res = await fetch(path, { method: 'POST', credentials: 'same-origin', headers, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    out.textContent = JSON.stringify({ status: res.status, ...data }, null, 2);
  }
  document.getElementById('hl-preview').onclick = () => call('/api/storage/hardlink/preview');
  document.getElementById('hl-apply')?.addEventListener('click', () => call('/api/storage/hardlink/apply'));
})();
</script>
{% endblock %}
