<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ title }}</title>
</head>
<body style="font-family: system-ui, sans-serif; line-height: 1.45; color: #1a1a1a;">
  <p><strong>{{ title }}</strong></p>
  {% if body %}
  <p>{{ body }}</p>
  {% endif %}
  {% if link %}
  <p><a href="{{ link }}">Open in GameTheca</a></p>
  {% endif %}
  <p style="font-size: 0.9em; color: #555;">
    You opted in to email for mentions and direct messages.
    Turn this off under More → Notifications.
  </p>
</body>
</html>
