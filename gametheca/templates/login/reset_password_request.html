{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ 'css/setup/setup.css'|theme_asset }}">

<div class="container-login">
    <div class="content-login gt-setup" role="main" aria-labelledby="gt-reset-request-title">
        <div class="gt-setup__brand">
            <img
                src="{{ url_for('static', filename='newstyle/gametheca_mark.svg') }}"
                alt=""
                class="gt-setup__mark"
                width="56"
                height="56"
                decoding="async"
            >
            <h1 id="gt-reset-request-title" class="gt-setup__title">Reset password</h1>
            <p class="gt-setup__lede">Enter your email and we will send a reset link if an account exists.</p>
        </div>

        <form action="{{ url_for('login.reset_password_request') }}" method="post" novalidate>
            {{ form.hidden_tag() }}
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="gt-setup__field" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="gt-setup__actions">
                <input type="submit" value="Send reset link" class="btn btn-primary">
                <a href="{{ url_for('login.login') }}" class="btn btn-secondary">Back to sign in</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
