{# Oneirodex tab / touch icons — cache-bust when branding assets change. #}
{% set gt_icon_v = 'gt20260805' %}
<link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}?v={{ gt_icon_v }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}?v={{ gt_icon_v }}">
<link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='icons/favicon-48.png') }}?v={{ gt_icon_v }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}?v={{ gt_icon_v }}">
