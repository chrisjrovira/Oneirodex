{% import 'partials/icons.html' as icons %}
<form method="POST" action="{{ url_for('admin2.community_chat_settings') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <p class="text-muted small">
        Deep-link to a self-hosted Stoat or Matrix room. Oneirodex does not host chat —
        see <code>docs/strategy/social.md</code>.
    </p>

    <div class="mb-3">
        <label for="community_chat_url" class="form-label">Community chat URL</label>
        <input type="url" class="form-control" id="community_chat_url" name="community_chat_url"
               value="{{ community_chat_url or '' }}"
               placeholder="https://chat.example.com or Matrix/Stoat invite">
    </div>

    <div class="mb-3">
        <label for="community_chat_label" class="form-label">Button label</label>
        <input type="text" class="form-control" id="community_chat_label" name="community_chat_label"
               value="{{ community_chat_label or 'Open community' }}"
               placeholder="Open community" maxlength="120">
    </div>

    <button type="submit" class="btn btn-primary">Save community link</button>
</form>
