<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}GameTheca{% endblock %}</title>
    {% block styles %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/notify/0.4.2/notify.min.js"></script>

    <script src="{{ 'js/csrf-utils.js'|theme_asset }}"></script>

    <link rel="stylesheet" href="{{ 'css/gt-tokens.css'|theme_asset }}">
    <link rel="stylesheet" href="{{ 'css/gt-chrome.css'|theme_asset }}">
    <link rel="stylesheet" href="{{ 'css/base.css'|theme_asset }}">
    <link rel="stylesheet" href="{{ 'css/modal-components.css'|theme_asset }}">
    <link rel="stylesheet" href="{{ 'css/form-components.css'|theme_asset }}">
    <link rel="stylesheet" href="{{ 'css/components.css'|theme_asset }}">
    <link rel="stylesheet" href="{{ 'css/games/library_browser.css'|theme_asset }}">
    <link rel="stylesheet" href="{{ 'css/games/game_status.css'|theme_asset }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/member-app/member-app.css') }}">

    <script src="{{ 'js/preferences_modal.js'|theme_asset }}"></script>
    <script src="{{ 'js/popup_menu.js'|theme_asset }}"></script>
    <script src="{{ 'js/delete_game_modal.js'|theme_asset }}"></script>
    <style>
      /* No left sidebar on member SPA shell */
      #content.member-spa-content {
        margin-left: 0;
        margin-right: 0;
        width: 100%;
        max-width: 100%;
      }
    </style>
    {% endblock %}
</head>
<body>
<div id="content" class="member-spa-content">
    {% include 'partials/flash_messages.html' %}
    {% block content %}{% endblock %}
</div>
{% include 'partials/delete_game_modal.html' %}
<div id="preferencesModalContainer"></div>
</body>
</html>
