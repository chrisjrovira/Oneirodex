name: Desktop build

# Product stance: code signing is unsupported permanently — Windows SmartScreen
# and macOS Gatekeeper warnings are the accepted tradeoff for self-hosted use.
# Do not reintroduce WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD secrets,
# a signtool step, or Apple notarization credentials. Unsigned bundles are the
# supported distribution path. See docs/runbooks/desktop-code-signing.md.
#
# Bundling (bundle.active) IS on — "unsigned" is about certificates, not about
# whether users get an installer. Targets are nsis / dmg / deb + appimage;
# .msi and .rpm are left out because both reject the pre-release version.

on:
  workflow_dispatch:
  push:
    paths:
      # api-client (and the shared workspace it builds on) is a source
      # dependency of the desktop app — a change there can break the build or
      # the Rust-facing contract without touching clients/desktop.
      - 'clients/desktop/**'
      - 'frontend/api-client/**'
      - 'frontend/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'clients/desktop/**'
      - 'frontend/api-client/**'
      - 'frontend/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'

jobs:
  rust-checks:
    name: rust · fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/desktop/src-tauri

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # npm workspaces: the only lockfile is at the repo root now.
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # tauri links the lib against webkit2gtk even for `cargo test` / `cargo
      # clippy`, so the same system deps the Linux bundle needs apply here.
      - name: Install Linux system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/desktop/src-tauri/target
          key: ubuntu-latest-cargo-checks-${{ hashFiles('clients/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-

      # `tauri::generate_context!()` fails to compile unless `frontendDist`
      # (clients/desktop/dist) exists, so the lib — and therefore `cargo test` /
      # `cargo clippy` — needs the web assets built first.
      - name: Install workspace (repo-root npm ci)
        working-directory: .
        run: npm ci

      - name: Build frontend assets
        working-directory: clients/desktop
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  build:
    name: ${{ matrix.label }} · ${{ matrix.flavor }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/desktop

    strategy:
      # One platform failing should not hide whether the others are shippable.
      fail-fast: false
      # Every combination is spelled out rather than crossed with an `include`.
      # An include entry that sets none of the base matrix keys is merged into
      # *all* combinations, so a `flavor: [full, thin]` base plus three os
      # includes collapses to two jobs, both on the last os listed.
      matrix:
        include:
          - os: windows-latest
            label: windows
            flavor: full
            target_dir: release
            extra_args: ''
            artifacts: |
              clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: windows-latest
            label: windows
            flavor: thin
            target_dir: release
            extra_args: ''
            artifacts: |
              clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
          # macos-latest is Apple silicon, so a plain build leaves Intel Macs
          # with nothing. The universal target produces one dmg for both.
          - os: macos-latest
            label: macos
            flavor: full
            target_dir: universal-apple-darwin/release
            extra_args: '-- --target universal-apple-darwin'
            artifacts: |
              clients/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-latest
            label: macos
            flavor: thin
            target_dir: universal-apple-darwin/release
            extra_args: '-- --target universal-apple-darwin'
            artifacts: |
              clients/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            label: linux
            flavor: full
            target_dir: release
            extra_args: ''
            artifacts: |
              clients/desktop/src-tauri/target/release/bundle/deb/*.deb
              clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: ubuntu-latest
            label: linux
            flavor: thin
            target_dir: release
            extra_args: ''
            artifacts: |
              clients/desktop/src-tauri/target/release/bundle/deb/*.deb
              clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # npm workspaces: the only lockfile is at the repo root now.
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.label == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      # webkit2gtk is what Tauri links the webview against, and it is the reason
      # a Linux bundle cannot be produced on a Windows or macOS host.
      - name: Install Linux system dependencies
        if: matrix.label == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/desktop/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('clients/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # The two flavors bundle into the same directory and share a cargo cache,
      # so a restored cache can carry the other flavor's installer. Without this
      # the upload glob would ship both under one flavor's artifact name.
      - name: Clear stale bundles
        shell: bash
        run: rm -rf "src-tauri/target/${{ matrix.target_dir }}/bundle"

      - name: Install workspace (repo-root npm ci)
        working-directory: .
        run: npm ci

      - name: Unit tests
        # Once per platform is enough; the thin leg builds the same sources.
        if: matrix.flavor == 'full'
        run: npm test

      - name: Build (unsigned)
        run: npm run tauri:build${{ matrix.flavor == 'thin' && ':thin' || '' }} ${{ matrix.extra_args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oneirodex-${{ matrix.flavor }}-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          # Bundling produced nothing is exactly the failure this workflow
          # exists to catch — it is what "we have mac/linux builds" turned out
          # not to mean while bundle.active was false.
          if-no-files-found: error
