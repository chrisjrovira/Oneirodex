# GameTheca CI — PR gate with a *core* pytest subset (+ member-app / desktop vitest).
#
# Full pytest suite remains local / release-time (needs Unraid-like fixtures,
# library paths, and heavier integrations). Do not treat this workflow as
# coverage of the entire tests/ tree.
#
# See: docs/runbooks/release-checklist.md · docs/runbooks/local-postgres-pytest.md
# Scrub shipped SPA bundles before image publish: docs/runbooks/scrub-shipped-bundles.md

name: CI tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'

concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prompt-trees:
    name: Prompt trees in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check .cursor/ skills+agents match .claude/
        run: python scripts/sync_prompt_trees.py --check

  pytest-core:
    name: Pytest (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # DB name must contain "test" (enforced by conftest.py).
          POSTGRES_DB: gamethecatest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gamethecatest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Must contain "test" in the database name — never point at production.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gamethecatest
      SECRET_KEY: ci-test-secret-key-not-for-production
      FLASK_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest is not pinned in requirements.txt (dev/CI only).
          pip install pytest

      - name: Run core pytest subset
        # Core gate only — full suite is still local/release.
        # Keep this list bare: `run: >` is a folded scalar, so a `#` line here
        # becomes an argument to pytest rather than a comment.
        run: >
          python -m pytest -q
          tests/test_health_probes.py
          tests/test_asgi_static.py
          tests/test_utils_ops_summary.py
          tests/test_routes_ops.py
          tests/test_security_suite.py
          tests/test_security_headers.py
          tests/test_ssrf_hardening.py
          tests/test_no_inline_scripts.py
          tests/test_image_upload_hardening.py
          tests/test_auth_hardening.py
          tests/test_theme_js_guards.py
          tests/test_vendor_licensing.py
          tests/test_webretro_player_chrome.py
          tests/test_emulator_play_matrix.py
          tests/test_product_name.py
          tests/test_gt_toast.py
          tests/test_browse_path_status.py
          tests/test_legal_surface.py
          tests/test_rbac_unit.py
          tests/test_routes_styleguide.py
          tests/test_templates_rail_chrome.py
          tests/test_admin_shell.py
          tests/test_static_svg.py
          tests/test_platform_recency.py
          tests/test_browse_title_grouping.py
          tests/test_setup_no_redirect_loop.py
          tests/test_integrations_inventory_sources.py
          tests/test_cascade_default_behaviour.py
          tests/test_ownership_poller.py
          tests/test_store_ownership.py
          tests/test_emulator_bios_discovery.py
          tests/test_emulator_bios_import.py
          tests/test_cover_art_variety.py
          tests/test_cover_art_text.py
          tests/test_cover_quality.py
          tests/test_preset_themes.py
          tests/test_theme_picker_ui.py
          tests/test_global_settings_singleton.py
          tests/test_routes_info.py
          tests/test_template_icons.py
          tests/test_detail_layout_presets.py
          tests/test_theme_freshness.py
          tests/test_theme_asset.py
          tests/test_font_bundle.py
          tests/test_sortable_tables.py
          tests/test_button_contract.py
          tests/test_api_envelope_lint.py
          tests/test_w20_scan_match_api.py
          tests/test_sse_wsgi_fallback.py
          tests/test_patch_catalog.py
          tests/test_patch_catalog_attach.py
          tests/test_wishlist_versions_artwork.py
          tests/test_wave2c_support_news_notifications.py
          tests/test_wave2a_details_media.py
          tests/test_updates_scan_and_shelves.py

      # UID-018 ratchet. The envelope helper landed with two files migrated and
      # the problem then grew from ~699 call sites to 1194 — new routes reached
      # for the old shapes faster than old ones were converted. Same model as
      # css-token-lint, which took CSS violations from 2365 to 1305.
      - name: Run API envelope lint
        run: python scripts/api_envelope_lint.py

  member-app-vitest:
    name: Member-app vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/member-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/member-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        # package.json "test" is "vitest"; --run exits non-interactively in CI.
        run: npm test -- --run

  admin-app-vitest:
    name: Admin-app vitest
    # Added with GT-A7: the admin ⌘K palette's index is derived from navConfig,
    # and adminCommands.test.js is what catches a destination silently dropping
    # out of it. Those tests are worth nothing unless they gate a PR.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/admin-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/admin-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test -- --run

      # tests/js holds standalone harnesses for classic theme JS, run under bare
      # node against a hand-rolled micro-DOM. They were in no workflow, so they
      # gated nothing — run here because this job already has Node set up.
      - name: Run classic theme JS harnesses
        working-directory: .
        run: node tests/js/preferences_modal_delegation.test.mjs

      - name: Run CSS token lint
        working-directory: .
        run: node scripts/css-token-lint.mjs

  desktop-vitest:
    name: Desktop vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run fast desktop vitest slice
        # Keychain / config / connection UX only — full desktop suite stays local.
        run: >
          npx vitest run
          src/keychain.test.ts
          src/config-store.test.ts
          src/connection-ux.test.ts
