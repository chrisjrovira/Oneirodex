# Dependabot — weekly dependency updates.
# Each `directory` entry is grouped so it produces at most one PR per run —
# minor, patch AND major bumps are bundled together now (npm splits only
# production vs development deps). This keeps review volume sane; the tradeoff
# is that a grouped PR can carry a breaking major, so review the grouped PR
# carefully before merging and split it by hand if a single major needs a
# closer look.
version: 2
updates:
  # --- Python (root requirements*.txt / requirements-dev.txt) ---
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major

  # --- Frontend SPAs + shared packages ---
  - package-ecosystem: npm
    directory: "/frontend/member-app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]
      development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]

  - package-ecosystem: npm
    directory: "/frontend/admin-app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]
      development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]

  - package-ecosystem: npm
    directory: "/frontend/ops-glance"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]
      development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]

  - package-ecosystem: npm
    directory: "/frontend/api-client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]
      development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]

  - package-ecosystem: npm
    directory: "/clients/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]
      development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]

  # --- GitHub Actions used by the workflows ---
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major
