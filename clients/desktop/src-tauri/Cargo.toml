[package]
name = "gametheca-desktop"
version = "0.0.1"
description = "GameTheca desktop companion"
authors = ["GameTheca"]
edition = "2021"

[lib]
name = "gametheca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
