[package]
name = "gametheca-desktop"
version = "0.1.0"
description = "GameTheca desktop companion"
authors = ["GameTheca"]
edition = "2021"

[lib]
name = "gametheca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2.2"
# OS credential store (Windows Credential Manager / macOS Keychain / Linux Secret Service)
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
