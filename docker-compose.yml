# GameTheca Docker Compose Configuration
#
# Setup Instructions:
# 1. Copy .env.docker.example to .env and customize your settings
# 2. Run: docker compose up -d --build
#
# DATABASE_URL must use host "db" (the Compose service name), not localhost.
# Volume Mounts:
# - DATA_FOLDER_WAREZ: Your games directory, mounted read-only to /storage
# - LIBRARY_HOST_PATH: Persistent storage for cover images, themes, and zips

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gametheca:0.1.0
    container_name: gametheca-app
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/gametheca}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATA_FOLDER_WAREZ=/storage
      - UPLOAD_FOLDER=/app/gametheca/static/library
      - SECRET_KEY=${SECRET_KEY}
      - DEV_MODE=${DEV_MODE:-false}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-gametheca}
      - ENABLE_ARR_MODULE=${ENABLE_ARR_MODULE:-false}
      - ENABLE_ARR_HARDLINK_PIPELINE=${ENABLE_ARR_HARDLINK_PIPELINE:-false}
      - ENABLE_AI_ASSIST=${ENABLE_AI_ASSIST:-false}
      - ENABLE_AI_AUTO_APPLY=${ENABLE_AI_AUTO_APPLY:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - ENABLE_HARDLINK_HELPERS=${ENABLE_HARDLINK_HELPERS:-false}
      - ALLOW_HARDLINK_APPLY=${ALLOW_HARDLINK_APPLY:-false}
      - ENABLE_VR_BROWSE=${ENABLE_VR_BROWSE:-false}
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - PROWLARR_URL=${PROWLARR_URL:-}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - JACKETT_URL=${JACKETT_URL:-}
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      - QBITTORRENT_URL=${QBITTORRENT_URL:-}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME:-admin}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - REMEMBER_COOKIE_SECURE=${REMEMBER_COOKIE_SECURE:-false}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${DATA_FOLDER_WAREZ}:/storage:ro"
      - "${LIBRARY_HOST_PATH:-./data/library}:/app/gametheca/static/library"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5006/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:17.6
    container_name: gametheca-db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-gametheca}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
    driver: local
