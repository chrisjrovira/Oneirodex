# A file named pytest.ini uses the [pytest] section. It had [tool:pytest] (the
# setup.cfg spelling), so pytest treated this as the config file for rootdir but
# loaded none of the options below — addopts, markers and filterwarnings were
# all silently inert, and --strict-markers never actually enforced.
[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Warnings are surfaced (no --disable-warnings) so deprecations in our own code
# don't rot silently. `default` shows each unique warning once per location
# rather than on every test. Add a specific `ignore::` line here only for a
# third-party warning we cannot act on from this repo — never a blanket ignore.
filterwarnings =
    default

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: slow, live-service or thread-spinning tests kept out of the fast CI subset
    unit: marks tests as unit tests
    database: marks tests that require database access

# Minimum version
minversion = 6.0